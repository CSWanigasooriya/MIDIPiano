// Top-level build file where you can add configuration options common to all sub-projects/modules.

plugins {
    id 'com.android.application' version '8.13.2' apply false
}

// Repositories are configured in settings.gradle (dependencyResolutionManagement).
// Do not add repositories here when repositoriesMode is set to FAIL_ON_PROJECT_REPOS.

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory.asFile
}