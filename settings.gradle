pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

// MidiDriver is consumed as a local .aar file dependency from :app.
// include ':MidiDriver-1.16'
include ':app'
rootProject.name = "MIDIPiano"